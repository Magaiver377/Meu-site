<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Uma surpresa para você 🎁</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, Helvetica, sans-serif;
            color: white;
            overflow: hidden;

            background:
                radial-gradient(circle at 20% 20%, #6c2bd9 0%, transparent 35%),
                radial-gradient(circle at 80% 80%, #e91e63 0%, transparent 35%),
                linear-gradient(135deg, #090014, #16002d, #050008);
        }

        /* Brilhos no fundo */
        .glow {
            position: absolute;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            background: rgba(174, 0, 255, 0.25);
            filter: blur(80px);
            animation: float 6s ease-in-out infinite;
        }

        .glow.one {
            top: -100px;
            left: -100px;
        }

        .glow.two {
            bottom: -120px;
            right: -100px;
            background: rgba(255, 0, 102, 0.25);
            animation-delay: -3s;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(30px);
            }
        }

        /* Cartão */
        .card {
            position: relative;
            z-index: 2;
            width: min(90%, 550px);
            padding: 55px 40px;
            text-align: center;

            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 28px;

            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);

            box-shadow:
                0 25px 80px rgba(0, 0, 0, 0.55),
                inset 0 1px rgba(255, 255, 255, 0.15);

            animation: appear 1s ease;
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(30px) scale(0.95);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .emoji {
            font-size: 70px;
            margin-bottom: 20px;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 100% {
                transform: translateY(0) rotate(0);
            }

            50% {
                transform: translateY(-10px) rotate(5deg);
            }
        }

        h1 {
            font-size: clamp(28px, 6vw, 44px);
            margin-bottom: 15px;
            background: linear-gradient(90deg, #fff, #ffb7f9, #c78cff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            color: #d8cde5;
            font-size: 17px;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        /* Botão */
        .button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;

            padding: 17px 32px;
            border-radius: 50px;

            color: white;
            text-decoration: none;
            font-size: 17px;
            font-weight: bold;

            background: linear-gradient(135deg, #ff2d8d, #8b35ff);

            box-shadow:
                0 10px 30px rgba(180, 40, 255, 0.35);

            transition:
                transform 0.25s ease,
                box-shadow 0.25s ease,
                filter 0.25s ease;
        }

        .button:hover {
            transform: translateY(-4px) scale(1.03);
            filter: brightness(1.15);

            box-shadow:
                0 15px 40px rgba(220, 40, 255, 0.5);
        }

        .button:active {
            transform: scale(0.97);
        }

        .youtube {
            font-size: 22px;
        }

        .small {
            margin-top: 25px;
            margin-bottom: 0;
            font-size: 12px;
            color: #8f829e;
        }

        /* Estrelinhas */
        .stars {
            position: absolute;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
        }

        .star {
            position: absolute;
            width: 3px;
            height: 3px;
            background: white;
            border-radius: 50%;
            opacity: 0.7;
            animation: twinkle 3s infinite;
        }

        @keyframes twinkle {
            0%, 100% {
                opacity: 0.2;
            }

            50% {
                opacity: 1;
            }
        }

        .star:nth-child(1) {
            top: 15%;
            left: 20%;
        }

        .star:nth-child(2) {
            top: 30%;
            left: 80%;
            animation-delay: 1s;
        }

        .star:nth-child(3) {
            top: 70%;
            left: 15%;
            animation-delay: 2s;
        }

        .star:nth-child(4) {
            top: 80%;
            left: 75%;
            animation-delay: 0.5s;
        }

        .star:nth-child(5) {
            top: 10%;
            left: 60%;
            animation-delay: 1.5s;
        }
    </style>
</head>

<body>

    <div class="glow one"></div>
    <div class="glow two"></div>

    <div class="stars">
        <div class="star"></div>
        <div class="star"></div>
        <div class="star"></div>
        <div class="star"></div>
        <div class="star"></div>
    </div>

    <main class="card">

        <div class="emoji">🎁</div>

        <h1>Tenho uma surpresa para você!</h1>

        <p>
            Prepare seus fones e aumente o volume... 
            <br>
            tem uma música esperando por você. 🎶
        </p>

        <a
            class="button"
            href="https://www.youtube.com/watch?v=nIq4z2fnzFU"
            target="_blank"
            rel="noopener noreferrer"
        >
            <span class="youtube">▶</span>
            Ouvir a música
        </a>

        <p class="small">
            Clique no botão para descobrir a surpresa ✨
        </p>

    </main>

</body>
</html>
